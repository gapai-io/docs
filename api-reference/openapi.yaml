openapi: '3.0.3'
info:
  title: Gapstack API
  version: '1.0'
  description: REST API for Gapstack tenants, projects, environments, resources, and integrations.
servers:
  - url: https://9nr7sbhimh.execute-api.us-west-1.amazonaws.com/prod
    description: Production
tags:
  - name: healthcheck
    description: Service health
  - name: tenants
    description: Tenants, members, infrastructure, and API keys
  - name: invitations
    description: Tenant invitations
  - name: projects
    description: Projects, variables, webhooks, and integrations
  - name: environments
    description: Environments, deploys, artifacts, and variables
  - name: resources
    description: Cloud resources
  - name: workflows
    description: Deployment and infrastructure workflows
  - name: aws-accounts
    description: Linked AWS accounts
  - name: integrations
    description: Marketplace integrations
  - name: github
    description: GitHub App install and webhooks
  - name: costs
    description: Aggregated cloud costs
  - name: summary
    description: Tenant dashboard summary
  - name: subscription
    description: Plans, usage, and billing webhooks
  - name: settings
    description: System settings, permissions, and superadmins
components:
  parameters:
    TenantId:
      name: Tenant-Id
      in: header
      required: true
      schema:
        type: string
      description: ID of the tenant (current tenant context).
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
      description: Project identifier.
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
      description: Webhook identifier.
    EnvVariableId:
      name: envVariableId
      in: path
      required: true
      schema:
        type: string
      description: Environment variable identifier.
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
      description: Environment identifier.
    ArtifactNameFilter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: Optional substring filter for artifact names.
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        type: string
      description: Integration identifier.
    AwsAccountId:
      name: awsAccountId
      in: path
      required: true
      schema:
        type: string
      description: AWS account (tenant resource) identifier.
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
      description: Workflow identifier.
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
      description: Subscription plan identifier.
    SettingsUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: Cognito user id (superadmin).
    EmailQuery:
      name: email
      in: query
      required: true
      schema:
        type: string
      description: Email address to search.
    TenantPathId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      description: Tenant identifier.
    TenantMemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
      description: Tenant member (user) identifier.
    ApiKeyPathId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
      description: API key identifier.
    InvitationEmailPath:
      name: email
      in: path
      required: true
      schema:
        type: string
      description: Invitee email (path segment; may be URL-encoded).
    AwsPermissionsFilter:
      name: filter
      in: query
      required: true
      schema:
        type: string
      description: Substring filter for IAM permission names.
    PaginationLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
      description: Maximum number of items to return.
    PaginationCursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for the next page of results.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token in the Authorization header (e.g. JWT / Cognito 
        access token).
    ApiKeyAuth:
      type: apiKey
      name: x-api-key
      in: header
      description: API key in the X-Api-Key header.
  
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        service_name:
          type: string
        status:
          type: string
        version:
          type: string
        build_date:
          type: string
        dependencies:
          type: object
          properties:
            application:
              type: string
        allowed_origins:
          type: array
          items:
            type: string

    PaasLibErrorCode:
      type: string
      description: |
        Machine-readable code from paas-lib (errors.Code). Matches github.com/gapai-io/paas-lib/pkg/errors.Code.
      enum:
        - common.internal_error
        - common.unavailable
        - common.timeout
        - common.conflict
        - common.not_implemented
        - validation.invalid
        - validation.required
        - auth.unauthorized
        - auth.forbidden
        - storage.not_found
        - storage.already_exists
        - storage.db_error
        - storage.constraint_violation
        - service.invalid_state
        - service.rule_violation
        - service.aborted
        - external.error
        - external.timeout
        - external.bad_response
        - stack.manual_deletion
        - subscription.invalid_state
        - subscription.rule_violation
        - subscription.canceled
        - subscription.not_found
        - subscription.limit_reached
      x-enum-varnames:
        - ErrInternalErrorCode
        - ErrUnavailableErrorCode
        - ErrTimeoutErrorCode
        - ErrConflictErrorCode
        - ErrNotImplementedErrorCode
        - ErrValidationInvalidCode
        - ErrValidationRequiredCode
        - ErrUnauthorizedCode
        - ErrForbiddenCode
        - ErrRepoNotFoundErrorCode
        - ErrRepoAlreadyExistsErrorCode
        - ErrRepoDBErrorCode
        - ErrRepoConstraintViolationErrorCode
        - ErrInvalidStateCode
        - ErrBusinessRuleCode
        - ErrOperationAbortCode
        - ErrExternalErrorCode
        - ErrExternalTimeoutCode
        - ErrExternalBadRespCode
        - ErrStackManualDeletionCode
        - ErrSubscriptionInvalidStateCode
        - ErrSubscriptionBusinessRuleCode
        - ErrSubscriptionCanceledCode
        - ErrSubscriptionNotFoundCode
        - ErrSubscriptionLimitReachedCode

    ErrorResponse:
      type: object
      description: |
        JSON body returned by WriteJsonError (internal/app/util.go errorResponse).
        Field `error` carries the human-readable message; `code` is set for Gapstack errors.
      properties:
        code:
          description: |
            Machine-readable code from paas-lib when the error is a GapstackError; omitted when not.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PaasLibErrorCode'
        error:
          type: string
          description: Human-readable error message (JSON key `error`, not 
            `message`).
        meta:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata (e.g. validation field names).

    MonthCostDetails:
      type: object
      description: Aggregated cost summary for a billing period.
      properties:
        cost:
          type: number
          format: double
        cost_unit:
          type: string
          description: Currency or unit for cost values (e.g. USD).
        max_day_cost:
          type: number
          format: double
        min_day_cost:
          type: number
          format: double
        average_day_cost:
          type: number
          format: double

    Webhook:
      type: object
      description: Project webhook subscription.
      properties:
        id:
          type: string
        events:
          type: array
          items:
            type: string
        endpoint:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EnvVariable:
      type: object
      description: Environment variable at project or environment scope.
      required:
        - id
        - name
        - value
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        sensitive:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        actor:
          type: string
          description: Email or identifier of the user who last changed the 
            variable.

    IntegrationCategory:
      type: string
      description: Integration marketplace category.
      enum:
        - PAYMENT
        - CRM
        - MARKETING
        - ACCOUNTING
        - OTHER
      x-enum-varnames:
        - Payment
        - CRM
        - Marketing
        - Accounting
        - Other

    ProjectStatus:
      type: string
      description: Lifecycle status of the project.
      enum:
        - ALPHA
        - BETA
        - RELEASE

    AwsRegion:
      type: string
      description: AWS region identifier. Matches models.AwsRegion JSON values in paas-lib.
      example: us-east-1
      enum:
        - us-east-1
        - us-east-2
        - us-west-1
        - us-west-2
        - us-gov-east-1
        - us-gov-west-1
        - ca-central-1
        - ca-west-1
        - eu-central-1
        - eu-central-2
        - eu-north-1
        - eu-west-1
        - eu-west-2
        - eu-west-3
        - eu-south-1
        - eu-south-2
        - me-south-1
        - me-central-1
        - mx-central-1
        - cn-north-1
        - cn-northwest-1
        - ap-east-1
        - ap-south-1
        - ap-south-2
        - ap-northeast-1
        - ap-northeast-2
        - ap-northeast-3
        - ap-southeast-1
        - ap-southeast-2
        - ap-southeast-3
        - ap-southeast-4
        - ap-southeast-5
        - ap-east-2
        - ap-southeast-7
        - ap-southeast-6
        - af-south-1
        - sa-east-1
      x-enum-varnames:
        - AwsRegionUsEast1
        - AwsRegionUsEast2
        - AwsRegionUsWest1
        - AwsRegionUsWest2
        - AwsRegionUsGovEast1
        - AwsRegionUsGovWest1
        - AwsRegionCaCentral1
        - AwsRegionCaWest1
        - AwsRegionEuCentral1
        - AwsRegionEuCentral2
        - AwsRegionEuNorth1
        - AwsRegionEuWest1
        - AwsRegionEuWest2
        - AwsRegionEuWest3
        - AwsRegionEuSouth1
        - AwsRegionEuSouth2
        - AwsRegionMeSouth1
        - AwsRegionMeCentral1
        - AwsRegionMxCentral1
        - AwsRegionCnNorth1
        - AwsRegionCnNorthwest1
        - AwsRegionApEast1
        - AwsRegionApSouth1
        - AwsRegionApSouth2
        - AwsRegionApNortheast1
        - AwsRegionApNortheast2
        - AwsRegionApNortheast3
        - AwsRegionApSoutheast1
        - AwsRegionApSoutheast2
        - AwsRegionApSoutheast3
        - AwsRegionApSoutheast4
        - AwsRegionApSoutheast5
        - AwsRegionApEast2
        - AwsRegionApSoutheast7
        - AwsRegionApSoutheast6
        - AwsRegionAfSouth1
        - AwsRegionSaEast1

    IntegrationEnvVariable:
      type: object
      description: Environment variable stored on a project integration.
      required:
        - name
        - value
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        sensitive:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        actor:
          type: string

    IntegrationCreate:
      type: object
      description: Payload to create a marketplace (catalog) integration.
      required:
        - category
        - company
        - description
        - instructions
        - name
        - overview
        - website_url
      properties:
        name:
          type: string
        description:
          type: string
        overview:
          type: string
        instructions:
          type: string
        is_free:
          type: boolean
        category:
          $ref: '#/components/schemas/IntegrationCategory'
        website_url:
          type: string
          format: uri
        doc:
          type: string
        support_url:
          type: string
        company:
          type: string
        privacy_policy_url:
          type: string
        icon:
          type: string
          format: uri
        env_variables:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: string
              sensitive:
                type: boolean
        is_active:
          type: boolean

    IntegrationEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/Integration'
        cursor:
          type: string

    PaginatedIntegrationList:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationEdge'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    Integration:
      type: object
      description: Integration attached to a project (marketplace metadata + env
        vars).
      required:
        - category
        - company
        - description
        - instructions
        - name
        - overview
        - website_url
      properties:
        id:
          type: string
          x-go-name: Pk
        sk:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
        overview:
          type: string
        instructions:
          type: string
        is_free:
          type: boolean
        category:
          $ref: '#/components/schemas/IntegrationCategory'
        website_url:
          type: string
          format: uri
        doc:
          type: string
        support_url:
          type: string
        company:
          type: string
        privacy_policy_url:
          type: string
        icon:
          type: string
          format: uri
        is_active:
          type: boolean
        env_variables:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationEnvVariable'

    ProjectDetails:
      type: object
      description: Full project representation returned by the API (includes 
        relations and cost summary).
      properties:
        id:
          type: string
          description: Primary key (project id).
          x-go-name: Pk
        sk:
          type: string
          description: Sort key.
        type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
        aws_account_id:
          type: string
          description: Linked AWS account id (12 digits).
        aws_region:
          $ref: '#/components/schemas/AwsRegion'
        max_budget:
          type: integer
          description: Maximum budget threshold for notifications.
        notify_when_forecast_cost_exceed:
          type: boolean
        notify_when_actual_cost_exceed:
          type: boolean
        domain:
          type: string
        cost:
          type: integer
          description: Current or last reported cost (application-defined 
            units).
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        env_variables:
          type: array
          items:
            $ref: '#/components/schemas/EnvVariable'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/Integration'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        notify_email:
          type: string
          nullable: true
          description: Notification email; may be null or empty when unset.
        month_cost:
          $ref: '#/components/schemas/MonthCostDetails'
          nullable: true
        cost_exceeded:
          type: boolean
          description: True when cost has exceeded configured thresholds.

    ProjectCreate:
      type: object
      description: Payload to create a new project.
      required:
        - aws_account_id
        - aws_region
        - max_budget
        - name
      properties:
        name:
          type: string
          example: Project Name
        description:
          type: string
          example: Project Description
        aws_account_id:
          type: string
          example: '123123123123'
        aws_region:
          $ref: '#/components/schemas/AwsRegion'
        max_budget:
          type: integer
          minimum: 0
          example: 1000
        notify_when_forecast_cost_exceed:
          type: boolean
          example: true
        notify_when_actual_cost_exceed:
          type: boolean
          example: true
        notify_email:
          type: string
          nullable: true
          description: May be omitted, null, or empty; when 
            notify_when_actual_cost_exceed is true, a non-empty valid email is 
            required (validated by the API).
          example: test@example.com
        domain:
          type: string
          example: example.com

    ProjectUpdate:
      type: object
      description: Payload to update an existing project.
      required:
        - aws_account_id
        - aws_region
        - id
        - max_budget
        - name
        - status
      properties:
        id:
          type: string
          example: Project_00000000
        name:
          type: string
          example: Project Name
        description:
          type: string
          example: Project Description
        aws_account_id:
          type: string
          example: '123123123123'
        aws_region:
          $ref: '#/components/schemas/AwsRegion'
        max_budget:
          type: integer
          minimum: 0
          example: 1000
        notify_when_forecast_cost_exceed:
          type: boolean
          example: true
        notify_when_actual_cost_exceed:
          type: boolean
          example: true
        notify_email:
          type: string
          nullable: true
          description: May be omitted, null, or empty; when 
            notify_when_actual_cost_exceed is true, a non-empty valid email is 
            required (validated by the API).
          example: test@example.com
        domain:
          type: string
          example: example.com
        status:
          $ref: '#/components/schemas/ProjectStatus'

    PageInfo:
      type: object
      properties:
        endCursor:
          type: string
        hasNextPage:
          type: boolean

    ProjectDetailsEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/ProjectDetails'
        cursor:
          type: string

    PaginatedProjectDetails:
      type: object
      description: Cursor-paginated list of projects (matches 
        repository.PaginatedItems JSON).
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDetailsEdge'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    BootstrapedInfo:
      type: object
      properties:
        artifacts_bucket_arn:
          type: string
        artifacts_bucket_name:
          type: string
        openid_role_arn:
          type: string
        openid_role_name:
          type: string

    EnvironmentStatus:
      type: string
      enum:
        - CLONED
        - DEFINED
        - DEPLOY_IN_PROGRESS
        - DEPLOYED
        - FAILED
        - ROLLBACK
        - REQUIRES_MANUAL_DELETION
      x-enum-varnames:
        - EnvironmentStatusCloned
        - EnvironmentStatusDefined
        - EnvironmentStatusDeployInProgress
        - EnvironmentStatusDeployed
        - EnvironmentStatusFailed
        - EnvironmentStatusRollback
        - EnvironmentStatusRequiresManualDeletion

    EnvironmentDetails:
      type: object
      properties:
        id:
          type: string
          x-go-name: Pk
        sk:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
        aws_region:
          $ref: '#/components/schemas/AwsRegion'
        aws_account_id:
          type: string
        status:
          $ref: '#/components/schemas/EnvironmentStatus'
        total_resources:
          type: integer
        env_variables:
          type: array
          items:
            $ref: '#/components/schemas/EnvVariable'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        last_workflow_id:
          type: string
        stack_info:
          type: string
        bootstraped_info:
          $ref: '#/components/schemas/BootstrapedInfo'
        month_cost:
          $ref: '#/components/schemas/MonthCostDetails'
          nullable: true

    EnvironmentDetailsEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/EnvironmentDetails'
        cursor:
          type: string

    PaginatedEnvironmentDetails:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentDetailsEdge'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    EnvironmentCreate:
      type: object
      required:
        - project_id
        - name
        - aws_region
        - aws_account_id
      properties:
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        aws_region:
          $ref: '#/components/schemas/AwsRegion'
        aws_account_id:
          type: string

    EnvironmentUpdate:
      type: object
      required:
        - id
        - sk
        - name
      properties:
        id:
          type: string
          x-go-name: Pk
        sk:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/EnvironmentStatus'

    EnvironmentDuplicateOptions:
      type: object
      properties:
        copy_env_variables:
          type: boolean
        copy_webhooks:
          type: boolean
        copy_resources:
          type: boolean
        aws_account:
          type: string
        aws_region:
          $ref: '#/components/schemas/AwsRegion'

    WorkflowStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - COMPLETED
        - FAILED
        - ROLLBACK
        - MANUAL_DELETION_REQUIRED

    WorkflowState:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/WorkflowStatus'
        resource_status:
          type: string
        resource_type:
          type: string
        logical_resource_id:
          type: string
        resource_status_reason:
          type: string
        detailed_status:
          type: string
        state_date:
          type: string
          format: date-time

    WorkflowDetails:
      type: object
      properties:
        id:
          type: string
          x-go-name: Pk
        sk:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        state_records:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowState'
        actor:
          type: string
        prev_stack:
          type: string
        new_stack:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        environment_id:
          type: string
        environment_name:
          type: string
        resources_ids:
          type: array
          items:
            type: string
        duration:
          type: number
          format: double

    WorkflowDetailsEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/WorkflowDetails'
        cursor:
          type: string

    PaginatedWorkflowDetails:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDetailsEdge'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ResourceDetailsEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/ResourceDetailsUnion'
        cursor:
          type: string

    PaginatedResourceDetails:
      type: object
      description: Cursor-paginated resources for an environment (node is 
        resource-type-specific).
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDetailsEdge'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ArtifactsByName:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    UploadArtifactRequest:
      type: object
      required:
        - folder_name
        - filename
        - content_type
      properties:
        folder_name:
          type: string
        filename:
          type: string
        content_type:
          type: string

    UploadArtifactResponse:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
        expires_at:
          type: string
          format: date-time
        content_type:
          type: string
        signed_headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ECRRepository:
      type: object
      properties:
        name:
          type: string
        uri:
          type: string
        registry:
          type: string
        image_tags:
          type: array
          items:
            type: string

    AuditLogChange:
