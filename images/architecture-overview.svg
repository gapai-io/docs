<svg width="880" height="640" viewBox="0 0 880 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">How Gapstack provisions resources in your AWS account</title>
  <desc id="archDesc">Your code, config, and linked AWS account flow into the Gapstack orchestration engine. The engine assumes an IAM role in your account and creates CloudFormation stacks. Project resources are provisioned in your AWS account.</desc>
  <rect width="880" height="640" rx="24" fill="#F8FAFC"/>

  <!-- Inputs -->
  <rect x="40" y="36" width="256" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="168" y="76" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Your code</text>
  <text x="168" y="100" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">GitHub repository</text>

  <rect x="312" y="36" width="256" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="440" y="76" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Your config</text>
  <text x="440" y="100" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Resource definitions</text>

  <rect x="584" y="36" width="256" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="712" y="76" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Your AWS account</text>
  <text x="712" y="100" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">IAM role in your account</text>

  <!-- Arrows into engine -->
  <path d="M168 140 v36" stroke="#94A3B8" stroke-width="2"/>
  <path d="M162 168 l6 10 6-10" fill="#94A3B8"/>
  <path d="M440 140 v36" stroke="#94A3B8" stroke-width="2"/>
  <path d="M434 168 l6 10 6-10" fill="#94A3B8"/>
  <path d="M712 140 v36" stroke="#94A3B8" stroke-width="2"/>
  <path d="M706 168 l6 10 6-10" fill="#94A3B8"/>

  <!-- Engine -->
  <rect x="40" y="196" width="800" height="96" rx="16" fill="#475569"/>
  <text x="440" y="238" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Gapstack orchestration engine</text>
  <text x="440" y="264" text-anchor="middle" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Control plane we operate. Assumes your IAM role and creates CloudFormation stacks.</text>

  <!-- Arrow into customer account -->
  <path d="M440 304 v36" stroke="#94A3B8" stroke-width="2"/>
  <path d="M434 332 l6 10 6-10" fill="#94A3B8"/>

  <!-- Customer AWS -->
  <rect x="40" y="360" width="800" height="244" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="440" y="396" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">PROVISIONED IN YOUR AWS ACCOUNT</text>

  <rect x="64" y="420" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="152" y="460" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">API</text>

  <rect x="256" y="420" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="344" y="460" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Lambda</text>

  <rect x="448" y="420" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="536" y="460" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">DynamoDB</text>

  <rect x="640" y="420" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="728" y="460" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">S3 / SQS</text>

  <rect x="64" y="508" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="152" y="548" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Auth</text>

  <rect x="256" y="508" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="344" y="548" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Events</text>

  <rect x="448" y="508" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="536" y="548" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Storage</text>

  <rect x="640" y="508" width="176" height="68" rx="34" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="728" y="548" text-anchor="middle" fill="#050817" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">DNS / CDN</text>
</svg>
